<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NorthPoint Bank — Sign In</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=DM+Serif+Display&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <style>
    .login-wrapper {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: var(--bg);
      padding: 24px;
    }

    .login-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 44px 48px;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 2px 16px rgba(0,0,0,0.06);
    }

    .login-brand {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 32px;
      justify-content: center;
    }

    .login-brand span {
      font-family: 'DM Serif Display', serif;
      font-size: 20px;
      color: var(--navy);
    }

    .login-heading {
      font-family: 'DM Serif Display', serif;
      font-size: 22px;
      font-weight: 400;
      color: var(--navy);
      margin-bottom: 6px;
      text-align: center;
    }

    .login-sub {
      font-size: 13px;
      color: var(--muted);
      text-align: center;
      margin-bottom: 28px;
    }

    .login-form {
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    .login-field {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .login-field label {
      font-size: 12px;
      font-weight: 500;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .login-field input {
      width: 100%;
      padding: 10px 13px;
      border: 1.5px solid var(--border);
      border-radius: 7px;
      font-family: 'DM Sans', sans-serif;
      font-size: 14px;
      color: var(--text);
      background: var(--surface);
      outline: none;
      transition: border-color 0.2s;
    }

    .login-field input:focus {
      border-color: var(--navy);
    }

    .login-btn {
      width: 100%;
      padding: 11px;
      background: var(--navy);
      color: #fff;
      border: none;
      border-radius: 7px;
      font-family: 'DM Sans', sans-serif;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.2s;
      margin-top: 4px;
    }

    .login-btn:hover {
      background: var(--navy-light);
    }

    .login-btn:disabled {
      background: var(--muted);
      cursor: not-allowed;
    }

    .login-footer {
      margin-top: 20px;
      text-align: center;
      font-size: 12.5px;
      color: var(--muted);
    }

    .login-footer a {
      color: var(--navy);
      text-decoration: none;
    }

    .auto-msg {
      margin-top: 14px;
      font-size: 12px;
      color: var(--muted);
      text-align: center;
      min-height: 18px;
    }

    .progress-bar-wrap {
      height: 3px;
      background: var(--border);
      border-radius: 2px;
      margin-top: 10px;
      overflow: hidden;
    }

    .progress-bar-fill {
      height: 100%;
      width: 0%;
      background: var(--navy);
      border-radius: 2px;
      transition: width 0.1s linear;
    }
  </style>
</head>
<body>

  <header class="site-header">
    <div class="header-inner">
      <div class="brand">
        <svg width="28" height="28" viewBox="0 0 28 28" fill="none">
          <rect width="28" height="28" rx="6" fill="#1a3a5c"/>
          <path d="M6 20h16M14 8v12M9 12h10" stroke="#c9a84c" stroke-width="2" stroke-linecap="round"/>
        </svg>
        <span class="brand-name">NorthPoint Bank</span>
      </div>
    </div>
  </header>

  <div class="login-wrapper">
    <div class="login-card">
      <div class="login-brand">
        <svg width="32" height="32" viewBox="0 0 28 28" fill="none">
          <rect width="28" height="28" rx="6" fill="#1a3a5c"/>
          <path d="M6 20h16M14 8v12M9 12h10" stroke="#c9a84c" stroke-width="2" stroke-linecap="round"/>
        </svg>
        <span>NorthPoint Bank</span>
      </div>

      <h1 class="login-heading">Sign in to Online Banking</h1>
      <p class="login-sub">Use your registered email and password</p>

      <form class="login-form" onsubmit="return false;">
        <div class="login-field">
          <label for="email">Email address</label>
          <input type="email" id="email" value="j.mitchell@email.com" autocomplete="email">
        </div>
        <div class="login-field">
          <label for="password">Password</label>
          <input type="password" id="password" value="••••••••••" autocomplete="current-password">
        </div>
        <button class="login-btn" id="sign-in-btn" type="submit" onclick="startLogin()">Sign in</button>
      </form>

      <div class="progress-bar-wrap" id="prog-wrap" style="display:none">
        <div class="progress-bar-fill" id="prog-fill"></div>
      </div>
      <p class="auto-msg" id="auto-msg"></p>

      <div class="login-footer">
        <a href="#">Forgot password?</a> &nbsp;&middot;&nbsp; <a href="#">Register</a>
      </div>
    </div>
  </div>

  <script>
    // Auto-login for demo — simulates the victim having saved credentials
    // or an active browser session. Fires on page load automatically.

    var AUTO_LOGIN_MS = 2200;

    function startLogin() {
      var btn  = document.getElementById('sign-in-btn');
      var msg  = document.getElementById('auto-msg');
      var wrap = document.getElementById('prog-wrap');
      var fill = document.getElementById('prog-fill');

      btn.disabled = true;
      btn.textContent = 'Signing in...';
      wrap.style.display = 'block';

      var start = Date.now();
      var interval = setInterval(function () {
        var pct = Math.min(100, ((Date.now() - start) / AUTO_LOGIN_MS) * 100);
        fill.style.width = pct + '%';

        if (pct < 40) {
          msg.textContent = 'Verifying credentials...';
        } else if (pct < 80) {
          msg.textContent = 'Loading your account...';
        } else {
          msg.textContent = 'Redirecting...';
        }

        if (pct >= 100) {
          clearInterval(interval);
          window.location.href = 'index.html';
        }
      }, 50);
    }

    // Auto-trigger for iframe context (the user is already "logged in")
    window.addEventListener('load', function () {
      setTimeout(startLogin, 300);
    });
  </script>
</body>
</html>
